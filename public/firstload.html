<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Premium Cinematic Camera Lens Loader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #111113 0%, #050507 60%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader-container {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8));
    }

    /* Soft warm flash overlay container with realistic anamorphic bloom hint */
    .flash-overlay {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 253, 248, 0.95) 0%, rgba(255, 220, 180, 0.45) 35%, rgba(100, 150, 255, 0.1) 60%, rgba(0, 0, 0, 0) 80%);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      animation: flashPulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .brand-mark {
      position: absolute;
      left: 50%;
      top: calc(100% + 18px);
      width: 58px;
      height: 58px;
      object-fit: contain;
      transform: translateX(-50%);
      filter: brightness(2.8);
      pointer-events: none;
      animation: brandMarkSequence 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* ===================================================
       KEYFRAME ANIMATIONS (Total duration: 2.2s)
       =================================================== */

    .aperture-group {
      transform-origin: 100px 100px;
      animation: apertureSequence 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes apertureSequence {
      0% {
        transform: scale(1) rotate(0deg);
      }
      36% {
        transform: scale(0.26) rotate(35deg);
      }
      /* Shutter snap open */
      40% {
        transform: scale(0.15) rotate(42deg);
      }
      54% {
        transform: scale(0.24) rotate(28deg);
      }
      88% {
        transform: scale(1) rotate(0deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes flashPulse {
      0%, 37% {
        opacity: 0;
        transform: scale(0.5);
      }
      40% {
        opacity: 0.85;
        transform: scale(1.15);
      }
      46% {
        opacity: 0;
        transform: scale(1.4);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes brandMarkSequence {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.92);
      }
      18%, 72% {
        opacity: 0.8;
        transform: translate(-50%, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -4px) scale(0.98);
      }
    }

    .lens-reveal {
      animation: lensLighting 2.2s ease-in-out infinite;
    }

    @keyframes lensLighting {
      0% {
        opacity: 0.4;
      }
      36% {
        opacity: 0.75;
      }
      41% {
        opacity: 1;
      }
      68% {
        opacity: 0.55;
      }
      100% {
        opacity: 0.4;
      }
    }

    .glass-reflection {
      transform-origin: 100px 100px;
      animation: reflectionShift 2.2s ease-in-out infinite;
    }

    @keyframes reflectionShift {
      0% {
        opacity: 0.3;
        transform: rotate(0deg) scale(1);
      }
      38% {
        opacity: 0.6;
        transform: rotate(5deg) scale(1.02);
      }
      42% {
        opacity: 0.9;
        transform: scale(1.04);
      }
      75% {
        opacity: 0.35;
        transform: rotate(-2deg) scale(1);
      }
      100% {
        opacity: 0.3;
        transform: rotate(0deg) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <!-- Warm Shutter Flash -->
    <div class="flash-overlay"></div>
    <img class="brand-mark" src="/icon.png" alt="">

    <!-- Camera Lens Vector Graphics -->
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Premium Anodized Titanium Outer Bezel -->
        <linearGradient id="outerBezel" x1="10" y1="10" x2="190" y2="190" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4a4a4f"/>
          <stop offset="25%" stop-color="#1c1c1f"/>
          <stop offset="50%" stop-color="#0a0a0c"/>
          <stop offset="75%" stop-color="#252529"/>
          <stop offset="100%" stop-color="#111113"/>
        </linearGradient>

        <linearGradient id="innerRing" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#242428"/>
          <stop offset="50%" stop-color="#0b0b0d"/>
          <stop offset="100%" stop-color="#1a1a1e"/>
        </linearGradient>

        <linearGradient id="metalHighlight" x1="100" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#777780" stop-opacity="0.7"/>
          <stop offset="50%" stop-color="#111113" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#55555c" stop-opacity="0.5"/>
        </linearGradient>

        <!-- High-End Multi-Coated Lens Reflections (Magenta/Cyan Cinema Flare) -->
        <linearGradient id="glassGlare1" x1="30" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e0f0ff" stop-opacity="0.35"/>
          <stop offset="25%" stop-color="#4099ff" stop-opacity="0.12"/>
          <stop offset="50%" stop-color="#d479ff" stop-opacity="0.08"/>
          <stop offset="80%" stop-color="#ffb066" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="glassGlare2" x1="170" y1="30" x2="30" y2="170" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#99d6ff" stop-opacity="0.2"/>
          <stop offset="40%" stop-color="#ff88cc" stop-opacity="0.08"/>
          <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <!-- Precision Brushed Blade Texture -->
        <linearGradient id="bladeGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#222225"/>
          <stop offset="50%" stop-color="#141416"/>
          <stop offset="100%" stop-color="#0a0a0c"/>
        </linearGradient>

        <!-- Clip path for aperture mechanism -->
        <clipPath id="apertureClip">
          <circle cx="100" cy="100" r="41"/>
        </clipPath>
      </defs>

      <!-- BASE & OUTER BARREL -->
      <g class="lens-reveal">
        <!-- Deep Ambient Outer Shadow & Edge -->
        <circle cx="100" cy="100" r="97" fill="#010102" stroke="#1c1c20" stroke-width="1.5"/>

        <!-- Outer Anodized Bezel Ring -->
        <circle cx="100" cy="100" r="91" stroke="url(#outerBezel)" stroke-width="6" fill="none"/>
        <circle cx="100" cy="100" r="88" stroke="#060608" stroke-width="1.2" fill="none"/>

        <!-- Machined Grip Thread Ring -->
        <circle cx="100" cy="100" r="78" fill="url(#innerRing)"/>
        <circle cx="100" cy="100" r="78" stroke="url(#metalHighlight)" stroke-width="1.5" fill="none"/>
        
        <!-- Matte Black Inner Barrel Depth -->
        <circle cx="100" cy="100" r="62" fill="#060608" stroke="#1a1a1e" stroke-width="2"/>
        <circle cx="100" cy="100" r="48" fill="#020203"/>
      </g>

      <!-- APERTURE MECHANISM -->
      <g clip-path="url(#apertureClip)">
        <!-- Deep Sensor Cavity -->
        <circle cx="100" cy="100" r="41" fill="#010102"/>

        <!-- Rotating Blades Group (9-Blade Cinematic Configuration) -->
        <g class="aperture-group">
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(40 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(80 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(120 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(160 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(200 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(240 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(280 100 100)"/>
          <path d="M100 59 C120 59, 135 70, 141 100 L100 100 Z" fill="url(#bladeGrad)" stroke="#28282d" stroke-width="0.5" transform="rotate(320 100 100)"/>
        </g>
      </g>

      <!-- FRONT GLASS ELEMENTS & MULTI-COATED REFLECTIONS -->
      <g class="glass-reflection" style="pointer-events: none;">
        <!-- Inner Multi-Layer Coating Glare -->
        <circle cx="100" cy="100" r="41" fill="url(#glassGlare2)"/>
        
        <!-- Curved Primary Aspherical Glass Surface Reflection -->
        <path d="M35 80 C 50 43, 150 43, 165 80 C 140 58, 60 58, 35 80 Z" fill="url(#glassGlare1)"/>
        
        <!-- Secondary Low-Dispersion Curved Flare -->
        <path d="M43 128 C 70 152, 130 152, 157 128 C 130 143, 70 143, 43 128 Z" fill="#7baaff" opacity="0.15"/>
        
        <!-- Sharp Edge Catchlight / Optical Pinpoint -->
        <ellipse cx="140" cy="60" rx="10" ry="3.5" transform="rotate(-32 140 60)" fill="#ffffff" opacity="0.4" filter="blur(0.8px)"/>
        <ellipse cx="62" cy="140" rx="7" ry="2.5" transform="rotate(25 62 140)" fill="#ff99e6" opacity="0.25" filter="blur(0.8px)"/>
      </g>

      <!-- INNER BARREL EDGE HIGHLIGHTS -->
      <circle cx="100" cy="100" r="41" fill="none" stroke="#000000" stroke-width="3" opacity="0.8"/>
      <circle cx="100" cy="100" r="41.5" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.15"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    </svg>
  </div>

</body>
</html>
